<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵感工具箱</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e6e8ec; --dim:#9aa3b2; --accent:#6ea8fe; --insp:#ffb454; --tool:#5ad19a;
    --junk:#8a93a3; --chip:#242935;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --line:#e2e5ea;
      --txt:#1a1d23; --dim:#6b7280; --chip:#eef1f5;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
  header{position:sticky;top:0;z-index:10;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 20px;display:flex;
    gap:16px;align-items:center;flex-wrap:wrap}
  .logo{font-weight:700;font-size:16px;white-space:nowrap}
  .logo span{color:var(--accent)}
  .search{flex:1;min-width:200px;display:flex;gap:8px}
  .search input{flex:1;background:var(--panel2);border:1px solid var(--line);
    color:var(--txt);padding:9px 14px;border-radius:9px;font-size:14px;outline:none}
  .search input:focus{border-color:var(--accent)}
  nav{display:flex;gap:4px}
  nav button,.tab{background:transparent;border:1px solid transparent;color:var(--dim);
    padding:7px 14px;border-radius:8px;cursor:pointer;font-size:14px}
  nav button.on,.tab.on{background:var(--panel2);color:var(--txt);border-color:var(--line)}
  .wrap{display:flex;gap:0;min-height:calc(100vh - 58px)}
  aside{width:200px;border-right:1px solid var(--line);padding:16px 12px;
    background:var(--panel);flex-shrink:0}
  aside h4{margin:0 0 8px;color:var(--dim);font-size:12px;font-weight:600;
    text-transform:uppercase;letter-spacing:.5px}
  .tag{display:inline-flex;align-items:center;gap:5px;background:var(--chip);
    border:1px solid var(--line);color:var(--txt);padding:5px 10px;border-radius:20px;
    margin:0 6px 6px 0;cursor:pointer;font-size:12.5px}
  .tag.on{background:var(--accent);color:#08101f;border-color:var(--accent)}
  .tag em{color:var(--dim);font-style:normal;font-size:11px}
  .tag.on em{color:#08101f}
  main{flex:1;padding:18px 22px;overflow:auto}
  .stats{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 16px;min-width:90px}
  .stat b{display:block;font-size:22px;line-height:1.1}
  .stat span{color:var(--dim);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;display:flex;flex-direction:column;transition:.15s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card .thumb{width:100%;height:160px;object-fit:cover;background:var(--panel2);cursor:zoom-in}
  .card .no-thumb{height:auto;min-height:60px;padding:14px;background:var(--panel2);
    color:var(--txt);font-size:13.5px;line-height:1.5;white-space:pre-wrap;
    max-height:200px;overflow:hidden}
  .card .body{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card .kind{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;
    align-self:flex-start}
  .k-灵感{background:rgba(255,180,84,.18);color:var(--insp)}
  .k-工具{background:rgba(90,209,154,.18);color:var(--tool)}
  .k-未分类{background:var(--chip);color:var(--dim)}
  .k-垃圾{background:rgba(138,147,163,.18);color:var(--junk)}
  .card .title{font-weight:600;font-size:14px}
  .card .sum{color:var(--dim);font-size:12.5px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .meta{color:var(--dim);font-size:11px;margin-top:auto;display:flex;
    justify-content:space-between;gap:8px}
  .card .ctags{display:flex;flex-wrap:wrap;gap:4px}
  .card .ctags span{background:var(--chip);border-radius:5px;padding:1px 6px;font-size:11px}
  .toolcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;display:flex;flex-direction:column;gap:8px}
  .toolcard .tname{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
  .toolcard .badge{background:var(--tool);color:#062015;border-radius:20px;
    font-size:11px;padding:1px 8px}
  .toolcard a{color:var(--accent);text-decoration:none;font-size:13px;word-break:break-all}
  .toolcard .srcs{display:flex;gap:5px;flex-wrap:wrap}
  .toolcard .srcs img{width:52px;height:52px;object-fit:cover;border-radius:6px;cursor:zoom-in}
  .empty{color:var(--dim);text-align:center;padding:60px 20px;line-height:1.7}
  .btn{background:var(--accent);color:#08101f;border:none;padding:8px 16px;
    border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px}
  .btn.ghost{background:var(--chip);color:var(--txt)}
  .topics{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:18px;white-space:pre-wrap;line-height:1.7;margin-top:14px}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;
    align-items:center;justify-content:center;z-index:100;cursor:zoom-out}
  #lightbox img{max-width:92vw;max-height:92vh;border-radius:8px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .hint{color:var(--dim);font-size:12.5px}
</style>
</head>
<body>
<header>
  <div class="logo">灵感<span>工具箱</span></div>
  <div class="search">
    <input id="q" placeholder="搜索标题 / 摘要 / 图中文字…（回车）">
  </div>
  <nav id="views">
    <button data-v="browse" class="on">浏览</button>
    <button data-v="tools">工具库</button>
    <button data-v="topics">灵感选题</button>
    <button data-v="junk">垃圾复核</button>
  </nav>
</header>
<div class="wrap">
  <aside id="side">
    <h4>分类</h4>
    <div id="kinds"></div>
    <h4 style="margin-top:18px">标签</h4>
    <div id="tags"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="lightbox"><img id="lbimg"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let state={view:'browse',q:'',kind:'',tag:''};

async function api(p,opt){const r=await fetch(p,opt);return r.json();}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

async function loadStats(){
  const s=await api('/api/stats');
  $('#kinds').innerHTML=[
    ['','全部',s.items-s.junk],['灵感','灵感',s.inspiration],
    ['工具','工具',s.tools],['未分类','未分类',s.items-s.inspiration-s.tools-s.junk]
  ].map(([k,label,n])=>`<div class="tag ${state.kind===k?'on':''}" onclick="setKind('${k}')">${label} <em>${n||0}</em></div>`).join('');
}
async function loadTags(){
  const t=await api('/api/tags');
  $('#tags').innerHTML = t.length? t.slice(0,40).map(x=>
    `<div class="tag ${state.tag===x.name?'on':''}" onclick="setTag('${esc(x.name)}')">${esc(x.name)} <em>${x.count}</em></div>`).join('')
    : '<div class="hint">分类后出现标签</div>';
}
window.setKind=k=>{state.kind=state.kind===k?'':k;state.view='browse';syncNav();render();loadStats();}
window.setTag=t=>{state.tag=state.tag===t?'':t;state.view='browse';syncNav();render();loadTags();}

function card(it){
  const img=it.image_path?`<img class="thumb" loading="lazy" src="/${it.image_path}" onclick="zoom(this.src)">`
    :`<div class="no-thumb">${esc(it.ocr_text||it.summary||'(无文字)')}</div>`;
  const tags=(it.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('');
  return `<div class="card">${img}<div class="body">
    <span class="kind k-${it.kind}">${it.kind}</span>
    ${it.title?`<div class="title">${esc(it.title)}</div>`:''}
    ${it.summary?`<div class="sum">${esc(it.summary)}</div>`:
       (!it.image_path?'':`<div class="sum">${esc((it.ocr_text||'').slice(0,120))}</div>`)}
    ${it.url?`<a href="${esc(it.url)}" target="_blank" style="color:var(--accent);font-size:12px;word-break:break-all">${esc(it.url.slice(0,50))}</a>`:''}
    <div class="ctags">${tags}</div>
    <div class="meta"><span>${esc(it.captured_at||'')}</span><span>${esc(it.source_type)}</span></div>
  </div></div>`;
}

async function render(){
  const m=$('#main');
  if(state.view==='browse'){
    const p=new URLSearchParams({q:state.q,kind:state.kind,tag:state.tag,limit:120});
    const items=await api('/api/items?'+p);
    m.innerHTML=`<div class="row"><span class="hint">${state.q?`“${esc(state.q)}” `:''}${state.kind||'全部'}${state.tag?' · #'+esc(state.tag):''}：${items.length} 条</span></div>`
      + (items.length?`<div class="grid">${items.map(card).join('')}</div>`
         :`<div class="empty">没有内容。<br>先运行 <code>python -m src.run ingest</code> 导入，再 <code>classify</code> 分类。</div>`);
  }
  else if(state.view==='tools'){
    const ts=await api('/api/tools');
    m.innerHTML = ts.length? `<div class="grid">`+ts.map(t=>`<div class="toolcard">
      <div class="tname">${esc(t.name)} <span class="badge">×${t.mention_count}</span></div>
      ${t.purpose?`<div class="sum">${esc(t.purpose)}</div>`:''}
      ${t.official_url?`<a href="${esc(t.official_url)}" target="_blank">${esc(t.official_url)}</a>`:''}
      <div class="srcs">${(t.sources||[]).map(s=>s.image_path?`<img src="/${s.image_path}" onclick="zoom(this.src)">`:'').join('')}</div>
    </div>`).join('')+`</div>`
    : `<div class="empty">工具库为空。<br>AI 分类后，识别为"工具"的会自动合并到这里。</div>`;
  }
  else if(state.view==='topics'){
    m.innerHTML=`<div class="row">
      <span class="hint">从某个标签的灵感生成内容选题：</span>
      <select id="topicTag" class="tag" style="padding:7px 10px"></select>
      <button class="btn" onclick="genTopics()">生成选题</button></div>
      <div id="topicOut"></div>`;
    const tags=await api('/api/tags');
    $('#topicTag').innerHTML=tags.map(t=>`<option value="${esc(t.name)}">${esc(t.name)} (${t.count})</option>`).join('')||'<option>（暂无标签）</option>';
  }
  else if(state.view==='junk'){
    const items=await api('/api/junk?limit=200');
    m.innerHTML=`<div class="row"><span class="hint">被判为垃圾的内容（不进入库）。点"其实有用"召回。共 ${items.length} 条</span></div>`
      +(items.length?`<div class="grid">${items.map(it=>card(it).replace('</div></div>',
        `<button class="btn ghost" style="margin:0 12px 12px" onclick="recall(${it.id})">↺ 其实有用</button></div></div>`)).join('')}</div>`
        :`<div class="empty">暂无垃圾条目。</div>`);
  }
}
window.zoom=src=>{$('#lbimg').src=src;$('#lightbox').style.display='flex';}
$('#lightbox').onclick=()=>$('#lightbox').style.display='none';
window.recall=async id=>{await api('/api/recall/'+id+'?kind=灵感',{method:'POST'});render();loadStats();}
window.genTopics=async()=>{
  const tag=$('#topicTag').value; const out=$('#topicOut');
  out.innerHTML='<div class="hint" style="padding:20px">生成中…</div>';
  const r=await api('/api/topics',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({tag})});
  out.innerHTML = r.error?`<div class="empty">${esc(r.error)}</div>`:`<div class="topics">${esc(r.topics)}</div>`;
}

function syncNav(){$$('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===state.view));}
$$('#views button').forEach(b=>b.onclick=()=>{state.view=b.dataset.v;syncNav();render();});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){state.q=e.target.value.trim();state.view='browse';syncNav();render();}});

loadStats();loadTags();render();
</script>
</body>
</html>
